name: Release Package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing vX.Y.Z tag to validate and publish'
        required: true
        type: string

permissions:
  contents: read

jobs:
  preflight-windows:
    if: github.actor == 'Isra604'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify requested tag and main ancestry
        shell: pwsh
        run: |
          $tag='${{ inputs.tag }}'
          if($tag -notmatch '^v\d+\.\d+\.\d+$'){ throw "Invalid release tag format: $tag" }
          $tagCommit=(git rev-parse "refs/tags/$tag^{commit}" ).Trim()
          $head=(git rev-parse HEAD).Trim()
          if($tagCommit -ne $head){ throw "Requested tag $tag does not resolve to checked-out HEAD." }
          git merge-base --is-ancestor HEAD origin/main
          if($LASTEXITCODE -ne 0){ throw 'Release tag is not contained in origin/main.' }
          $version=(Get-Content VERSION -Raw).Trim()
          if("v$version" -ne $tag){ throw "Tag $tag does not match VERSION v$version" }
      - name: Package and core self-test
        shell: pwsh
        run: ./scripts/self-test.ps1 -BuildPackage
      - name: Cross-version upgrade and rollback red-team
        shell: pwsh
        run: |
          ./scripts/v2-upgrade-red-team.ps1
          ./scripts/v2.1-upgrade-red-team.ps1
          ./scripts/v2.2-upgrade-red-team.ps1
      - name: Dashboard v2.2 portable and Windows-native red-team
        shell: pwsh
        run: |
          python ./scripts/v2.2-dashboard-red-team.py
          ./scripts/v2.2-windows-dashboard-red-team.ps1
      - name: Permission, policy and runtime red-team
        shell: pwsh
        run: |
          python ./scripts/v2.1-control-red-team.py
          python ./scripts/v2.1-policy-fuzz-red-team.py
          python ./scripts/v2.1-runtime-red-team.py
          python ./scripts/v2.1-concurrency-red-team.py
      - name: Final adversarial brain, evidence and target-scope red-team
        shell: pwsh
        run: |
          python ./scripts/v2.1-final-adversarial-red-team.py
          python ./scripts/v2.1-target-scope-red-team.py
          python ./scripts/v2.1-overlap-red-team.py
      - name: Windows native control and authorization red-team
        shell: pwsh
        run: |
          ./scripts/v2.1-windows-control-red-team.ps1
          ./scripts/v2.1-windows-authorization-red-team.ps1
      - name: Windows filesystem redirection red-team
        shell: pwsh
        run: ./scripts/v2.1-windows-path-safety-red-team.ps1
      - name: Windows scheduler, rollback and timeout red-team
        shell: pwsh
        run: |
          ./scripts/v2.1-windows-scheduler-red-team.ps1
          ./scripts/v2.1-rollback-scheduler-red-team.ps1
          ./scripts/v2.1-windows-timeout-red-team.ps1
      - name: Portable process-tree timeout red-team
        shell: pwsh
        run: python ./scripts/v2.1-portable-timeout-red-team.py
      - name: Reproducible package provenance red-team
        shell: pwsh
        run: ./scripts/v2.1-reproducible-package-red-team.ps1

  preflight-unix:
    if: github.actor == 'Isra604'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify requested tag and main ancestry
        shell: bash
        run: |
          TAG='${{ inputs.tag }}'
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor HEAD origin/main
          test "v$(tr -d '\r\n' < VERSION)" = "$TAG"
      - name: Shell self-test
        shell: bash
        run: bash ./scripts/self-test.sh
      - name: Dashboard v2.2 portable red-team
        shell: bash
        run: python3 ./scripts/v2.2-dashboard-red-team.py
      - name: Portable permission and runtime red-team
        shell: bash
        run: |
          python3 ./scripts/v2.1-control-red-team.py
          python3 ./scripts/v2.1-policy-fuzz-red-team.py
          python3 ./scripts/v2.1-runtime-red-team.py
          python3 ./scripts/v2.1-concurrency-red-team.py
      - name: Final adversarial brain, evidence and target-scope red-team
        shell: bash
        run: |
          python3 ./scripts/v2.1-final-adversarial-red-team.py
          python3 ./scripts/v2.1-target-scope-red-team.py
          python3 ./scripts/v2.1-overlap-red-team.py
      - name: Unix scheduler preservation and failure red-team
        shell: bash
        run: python3 ./scripts/v2.1-unix-scheduler-red-team.py
      - name: Portable process-tree timeout red-team
        shell: bash
        run: python3 ./scripts/v2.1-portable-timeout-red-team.py

  release:
    if: github.actor == 'Isra604'
    needs: [preflight-windows, preflight-unix]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout exact tagged candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify release source again
        shell: pwsh
        run: |
          $tag='${{ inputs.tag }}'
          $head=(git rev-parse HEAD).Trim()
          $tagCommit=(git rev-parse "refs/tags/$tag^{commit}" ).Trim()
          if($head -ne $tagCommit){ throw 'Release checkout does not match requested tag.' }
          git merge-base --is-ancestor HEAD origin/main
          if($LASTEXITCODE -ne 0){ throw 'Release source is not contained in origin/main.' }
          $version=(Get-Content VERSION -Raw).Trim()
          if("v$version" -ne $tag){ throw "Tag $tag does not match VERSION v$version" }
      - name: Build release package after all platform gates passed
        shell: pwsh
        run: ./scripts/build-release.ps1
      - name: Verify release artifacts exist and provenance matches HEAD
        shell: pwsh
        run: |
          $zip="dist/PUNTASH-QA-${{ inputs.tag }}.zip"
          $sha="$zip.sha256"
          if(-not(Test-Path $zip) -or -not(Test-Path $sha) -or -not(Test-Path 'dist/release-manifest.json')){throw 'Release artifacts missing.'}
          $manifest=Get-Content dist/release-manifest.json -Raw|ConvertFrom-Json
          if([string]$manifest.source_commit -ne (git rev-parse HEAD).Trim()){throw 'Release manifest source_commit mismatch.'}
      - name: Refuse duplicate public release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view '${{ inputs.tag }}' 2>$null
          if($LASTEXITCODE -eq 0){ throw 'A public release already exists for this tag.' }
          exit 0
      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.tag }}" `
            "dist/PUNTASH-QA-${{ inputs.tag }}.zip" `
            "dist/PUNTASH-QA-${{ inputs.tag }}.zip.sha256" `
            "dist/release-manifest.json" `
            --title "PUNTASH QA ${{ inputs.tag }}" `
            --generate-notes

version: 2
system_name: Universal Comprehensive QA Gate System
mode: owner_policy
statuses:
  - PASS
  - FAIL
  - BLOCKED
  - NOT_RUN
  - NOT_APPLICABLE
severities:
  - Critical
  - High
  - Medium
  - Low
finding_id_pattern: UQ-YYYYMMDD-GXX-NNN
output:
  profile: profile/PROJECT_QA_PROFILE.md
  reports: reports
  evidence: evidence
  artifacts: artifacts
  remediation: remediation
  dispositions: dispositions
  state: state
remediation:
  authority_source: state/OWNER_POLICY.json
  safe_default: REPORT_ONLY
  legacy_allowed_modes_are_not_authority: true
  mechanical_authorization_required: true
  authorization_tool_windows: tools/authorize-change.ps1
  authorization_tool_unix: tools/authorize-change.sh
  hard_boundary_policy: config/permission-policy.json
  never_auto_change:
    - material_product_intent
    - architecture
    - public_api_contracts
    - security_policy
    - privacy_policy
    - authentication_semantics
    - authorization_semantics
    - database_schema
    - migrations
    - production_data
    - credentials
    - deployments
    - production
    - billing_or_paid_calls
    - destructive_operations
reporting:
  immutable_completed_reports: true
  overwrite_same_day: false
  second_run_suffix: HHMMSS
  preserve_reviewer_disposition_separately: true

legal:
  human_acceptance_required: true
  acceptance_receipt: state/HUMAN_ACCEPTANCE_RECEIPT.json
  ai_may_accept_terms: false
  require_fresh_acceptance_on_reinstall: true
  terms_version: 1.1.0
  installer_transmits_receipt: false

reliability_model:
  canonical_gate_count: 25
  cross_cutting_lens_count: 9
  config: gates/reliability.yaml
  require_lens_applicability_decision: true
  require_evidence_assurance: true

current_run_schema_version: 3
untrusted_project_content_policy: templates/UNTRUSTED_PROJECT_CONTENT.md
path_safety_windows: tools/path-safety.ps1
